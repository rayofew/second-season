<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#090d17" />

    <title>Eastside Second-Season Playoff Challenge</title>
    <script>
      // Before anything paints, so a reload never flashes the theme somebody turned off.
      try {
        var saved = localStorage.getItem('second-season.theme');
        if (saved === 'light' || saved === 'dark') document.documentElement.dataset.theme = saved;
      } catch (e) {}
    </script>

  </body>
